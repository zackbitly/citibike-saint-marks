name: Collect 9 AM snapshot

# Records one Citibike snapshot at 9 AM America/New_York for the in-radius
# stations.
#
# PRIMARY TRIGGER: an external, DST-aware scheduler (e.g. cron-job.org) calls
# GitHub's workflow_dispatch at 9:00 AM ET daily. workflow_dispatch runs within
# seconds, so the script's "NY hour == 9" guard reliably passes. GitHub's own
# `schedule` trigger is NOT reliable for this — it routinely delays runs by
# hours (past the hour guard) or drops them, which left the dataset empty.
#
# FALLBACK: the 13:05 UTC (9:05 EDT) and 14:05 UTC (9:05 EST) schedule entries
# remain as best-effort backups. The script's per-day dedupe guard means a late
# fallback run can never double-write a day the dispatch already captured.
on:
  schedule:
    - cron: "5 13 * * *"
    - cron: "5 14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a write even if NY time is not 9 AM (for testing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect-9am
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect snapshot
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python collector/collect_9am.py --force
          else
            python collector/collect_9am.py
          fi

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/snapshots_9am.jsonl; then
            git add data/snapshots_9am.jsonl
            git commit -m "Add 9 AM snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "No new snapshot to commit (outside 9 AM window or no change)."
          fi
